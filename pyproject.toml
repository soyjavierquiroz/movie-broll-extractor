[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-broll-extractor"
version = "0.1.0"
description = "Manifest-first inspection tooling for movie B-roll extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["google-genai==2.22.0", "python-dotenv==1.2.3", "scenedetect>=0.6,<0.8", "opencv-python-headless>=4.10"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
detector = ["torch>=2.4", "onnx>=1.16"]

[project.scripts]
movie-broll = "movie_broll.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
